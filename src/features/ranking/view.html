<section id="rankCard" class="card hidden rankView">
        <div class="libRankHead featureIntro">
          <div class="featureIntroText"><span class="featureEyebrow">Mỗi câu là một bước tiến</span>
          <h2>Nhìn lại nỗ lực của bạn</h2>
          <span class="small">Theo dõi số câu đã luyện hôm nay và tuần này.</span></div>
          <div data-mascot="trophy" data-mascot-size="card" aria-hidden="true"></div>

            <div class="rankList" id="studyRankList" role="list"></div>
          </div>
          <div class="rankMe hidden" id="studyRankMe"></div>
          <div class="rankFoot">
            <span class="rankFootDot" aria-hidden="true"></span>
