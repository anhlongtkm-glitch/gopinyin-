<section id="gameCard" class="card hidden gameArena pdGame" aria-label="Panda Du Hành">
  <header class="pdHud">
    <div class="pdBrandGroup">
      <button id="gaCloseBtn" class="pdIconButton" type="button" aria-label="Về sảnh game" title="Về sảnh game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg></button>
      <div class="pdBrand"><span>Panda <b>Du Hành</b></span><small id="pdTopicLabel">Level 1 · Gia đình</small></div>
    </div>
    <div class="pdHudNumbers">
      <div class="pdHudCell"><span><small>TIẾN ĐỘ</small><b id="pdClock">0/57</b></span></div>
      <div class="pdHudCell pdHudCell--score"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 3 6.4 7 .9-5.1 5 .9 7-5.8-3.4-6.2 3.4 1.2-7L2 9.3l7-.9z"/></svg><span><small>ĐIỂM</small><b id="gaScoreNum">0</b></span></div>
      <button id="gaPauseBtn" class="pdIconButton" type="button" aria-label="Tạm dừng ván" title="Space: tạm dừng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
    </div>
    <div class="pdTimeTrack" aria-hidden="true"><span id="pdTimeFill"></span></div>
  </header>
  <div class="pdSubHud"></div>
  <div class="gaStage pdStage" id="gaStage" tabindex="-1" aria-label="Sân chơi Panda Du Hành">
    <canvas id="gaCanvas" class="gaCanvas" aria-label="Mục tiêu chữ Hán đang rơi"></canvas>
    <div class="gaPlayer pdPlayer" id="gaPlayer" aria-hidden="true"><img id="pdShipImage" src="assets/game/panda-du-hanh/panda-ship.webp" width="512" height="444" alt="" decoding="async" draggable="false"></div>
    <div id="pdFeedback" class="pdFeedback" role="status" aria-live="polite"></div>
    <div class="gaOverlay pdOverlay" id="gaOverlay"></div>
  </div>
  <footer class="pdFlightBar">
    <div class="pdFlightHelp" id="pdInputDock"><span id="pdTyped" aria-label="Pinyin đang gõ">…</span><span>Gõ Pinyin để bắn<small>Backspace đổi mục tiêu</small></span></div>
    <div class="pdFlightTools">
      <button id="gaPyBtn" class="pdFlightButton" type="button" aria-pressed="false" title="Enter: hiện hoặc ẩn Pinyin"><span class="pdPinyinSymbol" aria-hidden="true">拼</span><span id="pdPinyinLabel">Hiện Pinyin</span><kbd>Enter</kbd></button>
      <button id="gaKbdBtn" class="pdIconButton" type="button" aria-label="Bật hoặc tắt bàn phím ảo" aria-pressed="false" title="Bàn phím ảo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M5 9h2m2 0h2m2 0h2m2 0h2M5 12h2m2 0h2m2 0h2m2 0h2M7 15h10"/></svg></button>
      <button id="gaOptionsBtn" class="pdIconButton" type="button" aria-label="Tùy chọn game" title="Tùy chọn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 3 1-1h4l1 3 3 1 3 1v4l-2 1v3l1 3-3 3-3-1h-3l-3 1-3-3 1-3v-3l-2-1V7l3-1 2-3z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
  </footer>
</section>
