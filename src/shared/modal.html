<div id="appModal" class="appModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="appModalTitle">
  <div class="appModalCard">
    <h3 id="appModalTitle" class="appModalTitle"></h3>
    <p id="appModalMsg" class="appModalMsg"></p>
    <input id="appModalInput" class="appModalInput hidden" type="text" autocomplete="off" aria-label="Ô nhập" />
    <div class="appModalActions">
      <button id="appModalCancel" class="btn secondary" type="button">Hủy</button>
      <button id="appModalOk" class="btn primary" type="button">Đồng ý</button>
    </div>
  </div>
</div>
