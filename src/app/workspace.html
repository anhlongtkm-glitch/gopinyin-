<details class="workspaceTools"><summary>Công cụ</summary><div><button class="ws-navItem" type="button" data-view="rank"><span class="ws-navLabel">Bảng xếp hạng</span></button><button class="ws-navItem" type="button" data-view="ai"><span class="ws-navLabel">AI sinh câu</span></button></div></details>
<div class="ws-sideFoot">

      <div class="ws-userChip" id="wsUserChip">
        <span class="ws-avatar" id="wsAvatar">K</span>
        <button class="ws-userInfo accountLink" id="wsProfileBtn" type="button" aria-label="Chỉnh sửa tài khoản"><b id="wsUserName">Khách</b><small id="wsUserPlan">Đăng nhập để học</small></button>
        <button class="btn" id="wsLoginBtn" type="button" data-open="auth">Đăng nhập</button>
        <button class="ws-logoutBtn" id="wsLogoutBtn" type="button" title="Đăng xuất">⏻</button>
      </div>
    </div>
<div class="topActions">

        <button id="themeToggle" class="btn secondary iconBtn" type="button" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng tối" aria-pressed="false">🌙</button>
        <button type="button" id="backLibrary" class="btn secondary backBtn hidden">← Game từ vựng</button>
      </div>
<div class="studyVisuallyHidden"><span id="wsViewTitle">Tổng quan</span><span id="wsViewSub">Học cùng gấu xanh</span></div>
