<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoPinyin — Ảnh Plan A và Plan B</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="review.css"></head><body><div id="root"></div><script>
const plans={a:{name:'HSK & các phòng luyện',description:'Chọn kỹ năng trực tiếp. HSK làm trung tâm, thanh điệu, shadowing và bài khóa có phòng luyện riêng.',difference:'Dễ tìm đúng chức năng và học theo thời gian của mình.',flow:'Chọn HSK / phòng luyện → thực hành → nhiệm vụ → gấu nhận XP.'},b:{name:'Hành trình cùng gấu',description:'Sáu trạm HSK 1, mỗi trạm là một bài khóa. Nghe, thanh điệu, gõ và shadowing nối thành các phiên nhỏ.',difference:'Gấu dẫn đường và nội dung liên kết thành một chuyến khám phá.',flow:'Chọn trạm → phiên Nghe → phiên Đọc/Gõ → Shadowing → dấu ấn trạm.'}};
const screens=[['dashboard','Tổng quan / Hành trình'],['hsk','HSK tự chọn'],['tone','Học thanh điệu'],['shadow','Shadowing'],['lesson','Luyện bài khóa'],['games','Game riêng'],['bear','Level & huy hiệu gấu']];
const board=new URLSearchParams(location.search).get('board');
function sheet(id){const p=plans[id];return `<section class="sheet"><header><div><span class="eyebrow">GOPINYIN · PLAN ${id.toUpperCase()}</span><h1>${p.name}</h1><p>${p.description}</p></div><aside><b>Bố cục Phiêu Lưu + màu Jade</b><span>Giữ HSK · Game riêng · Gấu lên level</span><small>Bản duyệt riêng · dữ liệu & chức năng mới minh họa</small></aside></header><div class="main-images"><section><h2>01 / ${id==='a'?'Chọn HSK và các phòng luyện trực tiếp':'Hành trình sáu trạm, chia phiên học nhỏ'}</h2><img src="${id}-dashboard.png" alt="Tổng quan Plan ${id}"></section><section><h2>02 / Level gấu trên điện thoại</h2><img src="${id}-mobile-bear.png" alt="Gấu của bạn trên điện thoại"><p class="phone-note">XP, huy hiệu, phụ kiện theo mốc level.<br>Mọi cấp HSK vẫn được tự chọn.</p></section></div><div class="feature-images">${[['tone','03 / Học thanh điệu'],['shadow','04 / Shadowing'],['lesson','05 / Bài khóa HSK 1'],['games','06 / Game là mục riêng']].map(([s,n])=>`<section><h2>${n}</h2><img src="${id}-${s}.png" alt="${n}"></section>`).join('')}</div><footer><b>${p.difference}</b><span>${p.flow}</span></footer></section>`;}
if(board&&plans[board]){document.body.className='board';document.getElementById('root').innerHTML=sheet(board);}else{document.getElementById('root').innerHTML=`<header class="intro"><span class="eyebrow">BẢN DUYỆT THEO YÊU CẦU ĐÃ CHỐT</span><h1>Hai cách tổ chức việc học.<br>Cùng một gấu xanh, cùng màu Jade.</h1><p>Chọn thiết kế số 1 và màu số 2. Giữ luyện HSK, Game riêng; bổ sung thanh điệu, shadowing, bài khóa, nhiệm vụ và gấu lên level.</p><div class="notice">Đây là ảnh và prototype riêng để nhận xét. Chưa sửa web chính, chưa gọi AI/micro hoặc lưu phần thưởng thật.</div><nav><a href="#plan-a">Xem Plan A</a><a href="#plan-b">Xem Plan B</a></nav></header><main>${Object.entries(plans).map(([id,p])=>`<article id="plan-${id}"><span class="eyebrow">PLAN ${id.toUpperCase()}</span><h2>${p.name}</h2><p>${p.description}</p><a class="cover" href="${id}-board.png"><img src="${id}-board.png" alt="Bảng ảnh Plan ${id.toUpperCase()}"></a><div class="actions"><a href="index.html?plan=${id}">Thử bản mẫu Plan ${id.toUpperCase()}</a><a href="${id}-board.png">Mở bảng ảnh lớn</a></div><div class="grid">${screens.map(([s,n])=>`<a href="${id}-${s}.png"><img src="${id}-${s}.png" alt="${n}" loading="lazy"><span>${n}</span></a>`).join('')}<a href="${id}-mobile-dashboard.png"><img src="${id}-mobile-dashboard.png" alt="Tổng quan mobile" class="phone" loading="lazy"><span>Tổng quan điện thoại</span></a><a href="${id}-mobile-bear.png"><img src="${id}-mobile-bear.png" alt="Gấu mobile" class="phone" loading="lazy"><span>Gấu trên điện thoại</span></a></div></article>`).join('')}</main><footer class="end">Mỗi plan có 9 ảnh chi tiết. Các hình không thể hiện chức năng đã triển khai trong web thật.</footer>`;}
</script></body></html>
